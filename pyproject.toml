[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsproj2fla"
version = "0.2.1"
description = "Convert ToonSquid (.tsproj) projects to Adobe Animate (.fla) files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "lz4>=4.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tsproj2fla = "tsproj2fla.__main__:main"

[tool.setuptools]
packages = ["tsproj2fla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
